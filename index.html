<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WOLF E-SPORTS — Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#03050b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Animated background */
.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%,#18223d 0%,#070b16 38%,#020307 80%);
}

.light{
    position:absolute;
    width:3px;
    height:180px;
    background:linear-gradient(transparent,#fff,#6db5ff,transparent);
    filter:drop-shadow(0 0 10px #4da3ff);
    opacity:.7;
    transform:rotate(28deg);
    animation:flash 2.8s infinite;
}

.l1{left:12%;top:-80px;animation-delay:.2s}
.l2{left:32%;top:-120px;animation-delay:1.2s}
.l3{left:70%;top:-100px;animation-delay:.7s}
.l4{left:88%;top:-150px;animation-delay:1.8s}

@keyframes flash{
    0%,75%,100%{opacity:0;transform:translateY(-80px) rotate(28deg)}
    78%{opacity:1}
    88%{opacity:.8;transform:translateY(700px) rotate(28deg)}
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px #65b8ff;
    animation:float 5s linear infinite;
}

@keyframes float{
    from{transform:translateY(110vh);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-10vh);opacity:0}
}

/* Main card */
.download-card{
    position:relative;
    z-index:5;
    width:min(92%,460px);
    padding:38px 25px 30px;
    text-align:center;
    border:1px solid rgba(90,170,255,.45);
    border-radius:28px;
    background:rgba(7,11,24,.82);
    backdrop-filter:blur(16px);
    box-shadow:
      0 0 30px rgba(30,130,255,.18),
      inset 0 0 30px rgba(40,100,255,.04);
    animation:cardIn 1s ease;
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(35px) scale(.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

/* Wolf logo */
.logo{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    background:radial-gradient(circle,#182d52,#060a13 70%);
    border:2px solid #55aaff;
    box-shadow:
      0 0 15px #298cff,
      0 0 45px rgba(41,140,255,.45);
    animation:logoPulse 2s infinite;
}

@keyframes logoPulse{
    0%,100%{transform:scale(1);box-shadow:0 0 15px #298cff,0 0 40px rgba(41,140,255,.35)}
    50%{transform:scale(1.06);box-shadow:0 0 25px #69bbff,0 0 65px rgba(41,140,255,.6)}
}

h1{
    margin-top:22px;
    font-size:34px;
    letter-spacing:3px;
    text-transform:uppercase;
    text-shadow:0 0 15px #4da8ff;
}

.subtitle{
    margin-top:8px;
    color:#aab8cc;
    font-size:14px;
    letter-spacing:1px;
}

.version{
    display:inline-block;
    margin-top:18px;
    padding:7px 14px;
    border:1px solid rgba(100,180,255,.4);
    border-radius:30px;
    color:#8ecaff;
    font-size:12px;
}

/* Download button */
.download-btn{
    position:relative;
    overflow:hidden;
    width:100%;
    margin-top:28px;
    padding:17px 20px;
    border:0;
    border-radius:14px;
    cursor:pointer;
    color:white;
    font-size:17px;
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(135deg,#1268ff,#00aaff);
    box-shadow:0 0 20px rgba(0,145,255,.45);
    transition:.25s;
}

.download-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 0 35px rgba(0,160,255,.7);
}

.download-btn:active{
    transform:scale(.97);
}

.download-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:70%;
    height:100%;
    background:linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );
    transform:skewX(-25deg);
    animation:shine 2.4s infinite;
}

@keyframes shine{
    0%{left:-100%}
    50%,100%{left:140%}
}

.info{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.info-box{
    padding:13px 5px;
    border-radius:12px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
}

.info-box b{
    display:block;
    font-size:12px;
    color:#7fc3ff;
}

.info-box span{
    display:block;
    margin-top:5px;
    font-size:11px;
    color:#8996a9;
}

.footer{
    margin-top:25px;
    color:#66748a;
    font-size:11px;
}

/* Lightning flash */
.flash{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:white;
    opacity:0;
    animation:screenFlash 5s infinite;
}

@keyframes screenFlash{
    0%,87%,100%{opacity:0}
    88%{opacity:.08}
    89%{opacity:0}
    90%{opacity:.05}
    91%{opacity:0}
}
</style>
</head>

    </div>

    <div class="footer">

    </div>

</div>

</html>
